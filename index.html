<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyNow – Red de Bibliotecas USAL</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Chakra+Petch:wght@400;500;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --rojo:   #d22020; --rojo-d: #a91919; --rojo-l: #fde8e8;
            --azul:   #385e9d; --azul-d: #1c3d6e; --azul-l: #e8eef8;
            --gris:   #4d4d4d; --gris-l: #f2f3f5; --gris-b: #e2e4e9;
            --blanco: #ffffff; --fondo:  #f5f6f8; --texto:  #1a1a20;
            --verde:  #16a34a; --verde-l:#dcfce7;
            --amber:  #d97706; --amber-l:#fef3c7;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Lato', sans-serif; background: var(--fondo); color: var(--texto); min-height: 100vh; overflow-x: hidden; }
        h1,h2,h3,.sg { font-family: 'Space Grotesk', sans-serif; }
        .cp { font-family: 'Chakra Petch', sans-serif; }

        /* LOGIN */
        .login-wrap { min-height:100vh; display:flex; }
        .login-left { flex:1; background:var(--azul-d); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:3rem; position:relative; overflow:hidden; }
        .login-left::before { content:''; position:absolute; inset:0; background:repeating-linear-gradient(-45deg,transparent,transparent 40px,rgba(255,255,255,0.03) 40px,rgba(255,255,255,0.03) 41px); }
        .login-right { width:460px; flex-shrink:0; background:var(--blanco); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:3rem 3.5rem; }

        /* INPUTS */
        .field-label { display:block; font-size:.75rem; font-weight:700; color:var(--gris); text-transform:uppercase; letter-spacing:.06em; margin-bottom:.4rem; font-family:'Space Grotesk',sans-serif; }
        .field-input { width:100%; padding:.8rem 1rem; border:2px solid var(--gris-b); border-radius:10px; font-family:'Lato',sans-serif; font-size:.95rem; outline:none; transition:border-color .2s; background:var(--blanco); }
        .field-input:focus { border-color:var(--azul); }

        /* BOTONES */
        .btn { border:none; border-radius:10px; font-family:'Space Grotesk',sans-serif; font-weight:600; cursor:pointer; transition:all .18s; display:inline-flex; align-items:center; justify-content:center; gap:.5rem; }
        .btn-azul { background:var(--azul); color:white; padding:.85rem 1.5rem; font-size:.95rem; width:100%; }
        .btn-azul:hover { background:var(--azul-d); transform:translateY(-1px); }
        .btn-azul:disabled { background:var(--gris-b); color:var(--gris); cursor:not-allowed; transform:none; }
        .btn-rojo { background:var(--rojo); color:white; padding:.7rem 1.4rem; font-size:.88rem; }
        .btn-rojo:hover { background:var(--rojo-d); }
        .btn-verde { background:var(--verde); color:white; padding:.7rem 1.4rem; font-size:.88rem; }
        .btn-verde:hover { background:#15803d; }
        .btn-outline { background:transparent; color:var(--azul); border:2px solid var(--azul); padding:.6rem 1.2rem; font-size:.85rem; }
        .btn-outline:hover { background:var(--azul-l); }
        .btn-ghost { background:transparent; color:var(--gris); border:none; padding:.55rem .9rem; font-size:.83rem; border-radius:8px; }
        .btn-ghost:hover { background:var(--gris-l); color:var(--texto); }

        /* SIDEBAR */
        .sidebar { width:230px; position:fixed; top:0; left:0; bottom:0; background:var(--azul-d); display:flex; flex-direction:column; z-index:100; box-shadow:4px 0 20px rgba(0,0,0,.15); transition: transform 0.3s ease; }
        .sidebar-logo { padding:1.4rem 1.2rem 1.2rem; border-bottom:1px solid rgba(255,255,255,.1); }
        .sn-badge { width:36px; height:36px; background:var(--rojo); border-radius:10px; display:inline-flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:.85rem; color:white; margin-bottom:.6rem; }
        .sidebar-nav { flex:1; padding:1rem .75rem; overflow-y:auto; }
        .nav-sec-label { font-family:'Chakra Petch',sans-serif; font-size:.62rem; font-weight:600; color:rgba(255,255,255,.3); text-transform:uppercase; letter-spacing:.1em; padding:.6rem .75rem .3rem; }
        .nav-btn { display:flex; align-items:center; gap:.7rem; width:100%; padding:.68rem .75rem; border-radius:8px; border:none; background:transparent; color:rgba(255,255,255,.6); font-family:'Lato',sans-serif; font-size:.85rem; cursor:pointer; transition:all .15s; text-align:left; }
        .nav-btn:hover { background:rgba(255,255,255,.08); color:white; }
        .nav-btn.active { background:var(--azul); color:white; font-weight:700; }
        .sidebar-footer { padding:.75rem; border-top:1px solid rgba(255,255,255,.1); }
        .user-chip { display:flex; align-items:center; gap:.6rem; padding:.6rem .75rem; background:rgba(255,255,255,.07); border-radius:8px; margin-bottom:.5rem; color: white; font-size: .85rem; }
        .avatar { width:32px; height:32px; border-radius:50%; background:var(--rojo); display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:.75rem; color:white; flex-shrink:0; }

        /* LAYOUT */
        .main { margin-left:230px; min-height:100vh; transition: margin-left 0.3s ease; }
        .topbar { position:sticky; top:0; z-index:90; background:rgba(245,246,248,.92); backdrop-filter:blur(12px); border-bottom:1px solid var(--gris-b); padding:.75rem 2rem; display:flex; align-items:center; gap:.5rem; }
        .menu-toggle { display: none; background: transparent; border: none; font-size: 1.5rem; color: var(--azul); cursor: pointer; margin-right: 1rem; }
        .breadcrumb { font-size:.78rem; color:var(--gris); display:flex; align-items:center; gap:.4rem; }
        .breadcrumb .cur { color:var(--texto); font-weight:700; }
        .page { padding:2rem 2.5rem; max-width:1100px; margin: 0 auto; }
        .page-title { font-family:'Space Grotesk',sans-serif; font-size:1.75rem; font-weight:700; margin-bottom:.3rem; }
        .page-sub { font-size:.88rem; color:var(--gris); margin-bottom:1.75rem; }

        /* CARDS */
        .card { background:var(--blanco); border:1px solid var(--gris-b); border-radius:14px; box-shadow:0 2px 8px rgba(0,0,0,.05); }
        .stat-card { background:var(--blanco); border:1px solid var(--gris-b); border-radius:12px; padding:1.2rem 1.4rem; }

        /* PROGRESS & BADGES */
        .ocu-bar { height:6px; border-radius:99px; background:var(--gris-b); overflow:hidden; margin:.5rem 0; }
        .ocu-fill { height:100%; border-radius:99px; transition:width .4s; }
        .badge { display:inline-flex; align-items:center; gap:3px; padding:3px 9px; border-radius:99px; font-size:.68rem; font-weight:700; font-family:'Chakra Petch',sans-serif; text-transform:uppercase; letter-spacing:.04em; }
        .b-critico { background:var(--rojo-l); color:var(--rojo); border:1px solid #fca5a5; }
        .b-optimo { background:var(--verde-l); color:#166534; border:1px solid #86efac; }
        .b-normal { background:var(--amber-l); color:#92400e; border:1px solid #fcd34d; }

        /* ALERTA */
        .alerta-azul { background:var(--azul-l); border:1.5px solid #93c5fd; border-radius:12px; padding:.85rem 1.2rem; display:flex; align-items:center; gap:.75rem; color:var(--azul-d); font-weight:600; font-size:.88rem; margin-bottom:1.25rem; }

        /* MISC */
        .grid3 { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:1rem; }
        .grid4 { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:1rem; }
        .fade-in { animation:fadeIn .3s ease-out; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

        /* SESION ACTIVA */
        .sesion-card, .pausa-card { background:linear-gradient(135deg,var(--azul-d),var(--azul)); color:white; border-radius:14px; padding:1.25rem; }
        .sesion-timer { font-family:'Chakra Petch',sans-serif; font-size:2rem; font-weight:700; letter-spacing:.05em; }
        .pausa-card { background:linear-gradient(135deg,#4c1d95,#6b21a8); }

        /* --- RESPONSIVE MEDIA QUERIES --- */
        @media (max-width: 768px) {
            .login-wrap { flex-direction: column; }
            .login-right { width: 100%; padding: 2.5rem 2rem; }
            .login-left { padding: 2rem; text-align: center; }
            
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            
            .main { margin-left: 0; width: 100%; }
            .menu-toggle { display: block; }
            
            .page { padding: 1.5rem 1rem; }
            .topbar { padding: 1rem 1.5rem; }
            
            .grid3, .grid4 { grid-template-columns: 1fr; }
            
            /* Ajuste widget sesión en móvil */
            .sesion-widget-container { width: calc(100vw - 2rem) !important; right: 1rem !important; bottom: 1rem !important; }
        }
    </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ── DATOS (Reducidos para el ejemplo) ── */
const BIBLIOTECAS = [
    { id:'zacut',   nombre:'Biblioteca General',     dir:'C/ Abraham Zacut s/n', ocu:68, plazas:320, libres:102 },
    { id:'derecho', nombre:'Biblioteca de Derecho',  dir:'Campus Unamuno',       ocu:45, plazas:180, libres:99 },
    { id:'anaya',   nombre:'Pal. de Anaya',          dir:'Plaza de Anaya s/n',   ocu:82, plazas:210, libres:38 },
];
const LIBROS = Array.from({length: 10}); // Mock
const ocuColor = p => p>=75?'#d22020': p>=50?'#d97706':'#16a34a';
const ocuLabel = p => p>=75?'crítico': p>=50?'normal':'óptimo';
const ocuClass = p => p>=75?'b-critico': p>=50?'b-normal':'b-optimo';

/* ── ICONOS BÁSICOS ── */
const Ic = ({n,s=16,style={}}) => {
    const paths = {
        seat: "M5 3h14a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM3 17h18M8 21v-4m8 4v-4",
        map: "M3 7l6-3 6 3 6-3v13l-6 3-6-3-6 3V7z",
        check: "M20 6L9 17l-5-5",
        book: "M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 19.5A2.5 2.5 0 0 0 6.5 22H20V2H6.5A2.5 2.5 0 0 0 4 4.5v15z",
        menu: "M3 12h18M3 6h18M3 18h18"
    };
    return (
        <svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={style}>
            <path d={paths[n] || paths.check}/>
        </svg>
    );
};

/* ── SESION ACTIVA ── */
function SesionActiva({ sesion }) {
    if(!sesion) return null;
    return (
        <div className="sesion-widget-container" style={{position:'fixed',bottom:'1.5rem',right:'1.5rem',zIndex:200,width:280}}>
            <div className="sesion-card" style={{boxShadow:'0 8px 32px rgba(0,0,0,.25)'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'.6rem'}}>
                    <div>
                        <div style={{fontSize:'.72rem',opacity:.75,fontFamily:'Chakra Petch',textTransform:'uppercase',letterSpacing:'.06em'}}>● Sesión activa</div>
                        <div style={{fontWeight:700,fontSize:'.92rem',marginTop:'.15rem'}}>{sesion.bibNombre} · {sesion.seatId}</div>
                    </div>
                    <span className="sesion-timer">00:00:00</span>
                </div>
            </div>
        </div>
    );
}

/* ── PANEL (Completado) ── */
function Panel({ onNavegar, setBibActiva, sesion }) {
    return (
        <div className="fade-in">
            <div className="page-title">Panel de Control</div>
            <div className="page-sub">Monitorización de espacios en tiempo real · Red USAL</div>

            {sesion && (
                <div className="alerta-azul">
                    <Ic n="seat" s={18}/> Sesión activa en <strong>{sesion.bibNombre}</strong> – Puesto <strong>{sesion.seatId}</strong>.
                </div>
            )}

            <div className="grid4" style={{marginBottom:'1.75rem'}}>
                {[
                    {label:'Plazas totales', val:BIBLIOTECAS.reduce((a,b)=>a+b.plazas,0), icon:'seat',  color:'#385e9d'},
                    {label:'Plazas libres',  val:BIBLIOTECAS.reduce((a,b)=>a+b.libres,0), icon:'check', color:'#16a34a'},
                    {label:'Bibliotecas',    val:BIBLIOTECAS.length,                      icon:'map',   color:'#d22020'},
                    {label:'Catálogo',       val:LIBROS.length,                           icon:'book',  color:'#d97706'},
                ].map(s=>(
                    <div key={s.label} className="stat-card">
                        <div style={{display:'flex',alignItems:'center',gap:'.6rem',marginBottom:'.6rem'}}>
                            <div style={{width:34,height:34,borderRadius:8,background:s.color+'18',display:'flex',alignItems:'center',justifyContent:'center',color:s.color}}><Ic n={s.icon} s={15}/></div>
                            <span style={{fontSize:'.76rem',color:'var(--gris)',fontWeight:600}}>{s.label}</span>
                        </div>
                        <div style={{fontFamily:'Space Grotesk',fontWeight:700,fontSize:'1.7rem',color:'var(--azul)'}}>{s.val}</div>
                    </div>
                ))}
            </div>

            <div style={{fontFamily:'Space Grotesk',fontWeight:700,fontSize:'.95rem',marginBottom:'.8rem',display:'flex',alignItems:'center',gap:'.5rem'}}>
                <Ic n="map" s={15} style={{color:'var(--azul)'}}/> Estado de Bibliotecas
            </div>
            
            <div className="grid3" style={{marginBottom:'1.75rem'}}>
                {BIBLIOTECAS.map(lib=>{
                    const ocuPct = Math.round((lib.ocu/lib.plazas)*100);
                    return (
                        <div key={lib.id} className="card" style={{padding:'1.2rem'}}>
                            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'.75rem'}}>
                                <div>
                                    <div style={{fontFamily:'Space Grotesk',fontWeight:700,fontSize:'1rem'}}>{lib.nombre}</div>
                                    <div style={{fontSize:'.76rem',color:'var(--gris)'}}>{lib.dir}</div>
                                </div>
                                <span className={`badge ${ocuClass(ocuPct)}`}>{ocuLabel(ocuPct)}</span>
                            </div>
                            <div className="ocu-bar">
                                <div className="ocu-fill" style={{width:`${ocuPct}%`, background: ocuColor(ocuPct)}}></div>
                            </div>
                            <div style={{display:'flex',justifyContent:'space-between',fontSize:'.75rem',color:'var(--gris)',marginTop:'.4rem',marginBottom:'1rem'}}>
                                <span>{lib.ocu} ocupadas</span>
                                <span>{lib.libres} libres</span>
                            </div>
                            <button className="btn btn-outline" style={{width:'100%'}} onClick={() => { setBibActiva(lib); onNavegar('mapa'); }}>
                                Ver Asientos
                            </button>
                        </div>
                    );
                })}
            </div>
        </div>
    );
}

/* ── COMPONENTE PRINCIPAL (Estructura Base) ── */
function App() {
    const [vista, setVista] = useState('panel');
    const [menuAbierto, setMenuAbierto] = useState(false);
    const [sesion, setSesion] = useState(null); // Ej: { bibNombre: 'ZACUT', seatId: 'A01' }
    
    // Cierra el menú al hacer clic en el main (comportamiento móvil)
    const handleMainClick = () => { if(menuAbierto) setMenuAbierto(false); };

    return (
        <div style={{ display: 'flex' }}>
            <div className={`sidebar ${menuAbierto ? 'open' : ''}`}>
                <div className="sidebar-logo">
                    <div className="sn-badge">SN</div>
                    <div style={{fontFamily:'Space Grotesk', fontWeight:700, color:'white'}}>StudyNow</div>
                </div>
                <div className="sidebar-nav">
                    <button className={`nav-btn ${vista==='panel'?'active':''}`} onClick={() => setVista('panel')}>Panel de Control</button>
                    <button className="nav-btn">Catálogo</button>
                    <button className="nav-btn">Mi Perfil</button>
                </div>
            </div>
            
            <div className="main" onClick={handleMainClick}>
                <div className="topbar">
                    <button className="menu-toggle" onClick={(e) => { e.stopPropagation(); setMenuAbierto(!menuAbierto); }}>
                        <Ic n="menu" s={24}/>
                    </button>
                    <div className="breadcrumb">StudyNow / <span className="cur">{vista.charAt(0).toUpperCase() + vista.slice(1)}</span></div>
                </div>
                
                <div className="page">
                    {vista === 'panel' && <Panel onNavegar={setVista} setBibActiva={()=>{}} sesion={sesion} />}
                </div>
            </div>
            
            <SesionActiva sesion={sesion} />
        </div>
    );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
